{% extends 'base.html' %}
{% load static %}
{% block title %}Services consulaires - ODZUNA{% endblock %}

{% block content %}
<style>
    /* ANIMATIONS CUSTOM */
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
    }
    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }
    @keyframes gradientFlow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    
    /* STYLES ULTRA HOT */
    .consulaire-section {
        padding: 6rem 1rem;
        background: linear-gradient(135deg, #f4f8fb 0%, #e8f2ff 100%);
        font-family: 'Poppins', sans-serif;
        position: relative;
        overflow: hidden;
    }
    
    .consulaire-section::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 10px;
        background: linear-gradient(to right, #1a73e8, #ff6f00, #1a73e8);
    }
    
    .consulaire-section h2 {
        text-align: center;
        color: #0f0c29;
        margin-bottom: 3rem;
        font-size: 2.8rem;
        font-weight: 800;
        position: relative;
        display: inline-block;
        left: 50%;
        transform: translateX(-50%);
    }
    
    .consulaire-section h2::after {
        content: '';
        position: absolute;
        bottom: -15px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 4px;
        background: linear-gradient(to right, #1a73e8, #ff6f00);
    }
    
    .consulaire-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 2.5rem;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 2rem;
    }
    
    .service-card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(26, 115, 232, 0.1);
        padding: 2.5rem;
        text-align: center;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(26, 115, 232, 0.1);
        backdrop-filter: blur(5px);
    }
    
    .service-card::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(26, 115, 232, 0.05) 0%, transparent 70%);
        animation: rotate 15s linear infinite;
    }
    
    .service-card:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 15px 40px rgba(26, 115, 232, 0.2);
    }
    
    .service-card i {
        font-size: 3.5rem;
        margin-bottom: 1.5rem;
        display: inline-block;
        background: linear-gradient(135deg, #1a73e8 0%, #00bcd4 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: float 4s ease-in-out infinite;
    }
    
    .service-card h3 {
        color: #0f0c29;
        margin-bottom: 1rem;
        font-size: 1.5rem;
        font-weight: 700;
        position: relative;
        z-index: 1;
    }
    
    .service-card p {
        font-size: 1rem;
        line-height: 1.6;
        color: #555;
        position: relative;
        z-index: 1;
    }
    
    .service-card .btn-cta {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.7rem 1.8rem;
        background: linear-gradient(to right, #1a73e8, #00bcd4);
        color: white;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 600;
        box-shadow: 0 5px 15px rgba(26, 115, 232, 0.3);
        transition: all 0.3s ease;
        position: relative;
        z-index: 1;
        overflow: hidden;
    }
    
    .service-card .btn-cta::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to right, #ff6f00, #ff3a5e);
        z-index: -1;
        opacity: 0;
        transition: opacity 0.3s ease;
    }
    
    .service-card .btn-cta:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(26, 115, 232, 0.4);
    }
    
    .service-card .btn-cta:hover::before {
        opacity: 1;
    }
    
    /* RESPONSIVE */
    @media (max-width: 768px) {
        .consulaire-section {
            padding: 4rem 1rem;
        }
        
        .consulaire-section h2 {
            font-size: 2.2rem;
        }
        
        .consulaire-grid {
            grid-template-columns: 1fr;
            padding: 0 1rem;
        }
    }
</style>

<!-- SECTION ULTRA HOT -->
<section class="consulaire-section">
    <h2 class="animate__animated animate__fadeIn">NOS SERVICES CONSULAIRES</h2>

    <div class="consulaire-grid">
        {% for service in services %}
        <div class="service-card wow-section">
            <i class="{{ service.icone }}"></i>
            <h3>{{ service.titre }}</h3>
            <p>{{ service.description }}</p>
            <a href="#" class="btn-cta">Découvrir</a>
            
            <!-- Effet visuel -->
            <div style="position: absolute; top: 20%; right: 10%; width: 20px; height: 20px; background: rgba(26, 115, 232, 0.1); border-radius: 50%; animation: float 6s ease-in-out infinite;"></div>
        </div>
        {% endfor %}
    </div>
</section>

<script>
    // Animation au scroll
    document.addEventListener('DOMContentLoaded', function() {
        gsap.utils.toArray(".wow-section").forEach((section, i) => {
            gsap.from(section, {
                scrollTrigger: {
                    trigger: section,
                    start: "top 80%",
                    toggleActions: "play none none none"
                },
                y: 50,
                opacity: 0,
                duration: 0.8,
                delay: i * 0.1,
                ease: "power3.out"
            });
        });
    });
</script>
{% endblock %}
