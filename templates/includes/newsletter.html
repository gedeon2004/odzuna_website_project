<section class="newsletter-section">
    <!-- Effet de particules en background -->
    <div class="particles-background" id="particles-js"></div>
    
    <div class="newsletter-container">
        <!-- Animation 3D -->
        <div class="newsletter-3d-icon">
            <div class="cube">
                <div class="face front"><i class="fas fa-envelope-open-text"></i></div>
                <div class="face back"><i class="fas fa-bell"></i></div>
                <div class="face right"><i class="fas fa-gift"></i></div>
                <div class="face left"><i class="fas fa-percent"></i></div>
                <div class="face top"><i class="fas fa-star"></i></div>
                <div class="face bottom"><i class="fas fa-rocket"></i></div>
            </div>
        </div>

        <div class="newsletter-content">
            <h3 class="newsletter-title">
                <span class="text-gradient">Rejoignez la révolution</span>
                <div class="typing-animation"></div>
            </h3>
            
            <p class="newsletter-subtitle">Soyez les premiers à découvrir nos exclusivités</p>
            
            <form class="newsletter-form" method="post">
                {% csrf_token %}
                <div class="floating-input-group">
                    <input type="email" id="newsletter-email" name="email" required>
                    <label for="newsletter-email">Votre email premium</label>
                    <div class="input-highlight"></div>
                </div>
                
                <button type="submit" class="neon-button">
                    <span>Accéder au cercle privé</span>
                    <div class="hover-effect"></div>
                </button>
                
                <div class="ai-validation">
                    <div class="validation-checkbox">
                        <input type="checkbox" id="consent-ai" name="consent" required>
                        <label for="consent-ai">
                            <span class="check-animation"></span>
                            <span>J'accepte les conditions intelligentes</span>
                        </label>
                    </div>
                    <div class="ai-feedback"></div>
                </div>
            </form>
            
            <div class="social-proof">
                <div class="avatars-stack">
                    <div class="avatar" style="background-image: url('avatar1.jpg')"></div>
                    <div class="avatar" style="background-image: url('avatar2.jpg')"></div>
                    <div class="avatar" style="background-image: url('avatar3.jpg')"></div>
                    <div class="avatar" style="background-image: url('avatar4.jpg')"></div>
                    <div class="avatar" style="background-image: url('avatar5.jpg')"></div>
                    <div class="avatar">+2.4K</div>
                </div>
                <p>Déjà adopté par les visionnaires</p>
            </div>
        </div>
    </div>
</section>

<style>
    :root {
        --primary-color: #6e45e2;
        --secondary-color: #88d3ce;
        --neon-color: #0ff0fc;
        --dark-bg: #0f0f1a;
    }
    
    .newsletter-section {
        position: relative;
        background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a2e 100%);
        padding: 4rem 1rem;
        overflow: hidden;
        color: white;
        font-family: 'Segoe UI', system-ui, sans-serif;
    }
    
    .particles-background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
    }
    
    .newsletter-container {
        position: relative;
        z-index: 2;
        max-width: 800px;
        margin: 0 auto;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 2rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.1);
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 2rem;
        align-items: center;
    }
    
    .newsletter-3d-icon {
        perspective: 1000px;
        display: flex;
        justify-content: center;
    }
    
    .cube {
        width: 150px;
        height: 150px;
        position: relative;
        transform-style: preserve-3d;
        animation: rotate 15s infinite linear;
    }
    
    .face {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 3rem;
        color: var(--neon-color);
        transition: all 0.5s ease;
    }
    
    .front  { transform: rotateY(0deg) translateZ(75px); }
    .back   { transform: rotateY(180deg) translateZ(75px); }
    .right  { transform: rotateY(90deg) translateZ(75px); }
    .left   { transform: rotateY(-90deg) translateZ(75px); }
    .top    { transform: rotateX(90deg) translateZ(75px); }
    .bottom { transform: rotateX(-90deg) translateZ(75px); }
    
    @keyframes rotate {
        from { transform: rotateX(-20deg) rotateY(0deg); }
        to { transform: rotateX(-20deg) rotateY(360deg); }
    }
    
    .newsletter-title {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        line-height: 1.2;
    }
    
    .text-gradient {
        background: linear-gradient(90deg, var(--neon-color), var(--secondary-color));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: gradient-shift 5s ease infinite;
        background-size: 200% 200%;
    }
    
    @keyframes gradient-shift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    
    .typing-animation {
        height: 2rem;
        font-size: 1.5rem;
        color: var(--secondary-color);
        border-right: 2px solid;
        animation: typing 3s steps(20) infinite, blink-caret 0.75s step-end infinite;
        white-space: nowrap;
        overflow: hidden;
        display: inline-block;
    }
    
    @keyframes typing {
        from { width: 0 }
        to { width: 100% }
    }
    
    @keyframes blink-caret {
        from, to { border-color: transparent }
        50% { border-color: var(--neon-color); }
    }
    
    .newsletter-subtitle {
        font-size: 1.1rem;
        margin-bottom: 2rem;
        opacity: 0.8;
    }
    
    .floating-input-group {
        position: relative;
        width: 100%;
        margin-bottom: 1.5rem;
    }
    
    .floating-input-group input {
        width: 100%;
        padding: 1rem;
        background: transparent;
        border: none;
        border-bottom: 2px solid rgba(255, 255, 255, 0.3);
        color: white;
        font-size: 1rem;
        transition: all 0.3s ease;
    }
    
    .floating-input-group input:focus {
        outline: none;
        border-bottom-color: var(--neon-color);
    }
    
    .floating-input-group label {
        position: absolute;
        left: 1rem;
        top: 1rem;
        color: rgba(255, 255, 255, 0.6);
        transition: all 0.3s ease;
        pointer-events: none;
    }
    
    .floating-input-group input:focus + label,
    .floating-input-group input:not(:placeholder-shown) + label {
        top: -1.2rem;
        left: 0;
        font-size: 0.8rem;
        color: var(--neon-color);
    }
    
    .input-highlight {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 2px;
        width: 0;
        background: var(--neon-color);
        transition: all 0.4s ease;
    }
    
    .floating-input-group input:focus ~ .input-highlight {
        width: 100%;
    }
    
    .neon-button {
        position: relative;
        background: none;
        color: var(--neon-color);
        border: 2px solid var(--neon-color);
        padding: 1rem 2rem;
        font-size: 1rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        border-radius: 50px;
        overflow: hidden;
        transition: all 0.3s ease;
        width: 100%;
        margin-bottom: 1.5rem;
        z-index: 1;
    }
    
    .neon-button:hover {
        background: rgba(15, 240, 252, 0.1);
        box-shadow: 0 0 10px var(--neon-color), 0 0 20px var(--neon-color);
    }
    
    .neon-button .hover-effect {
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(15, 240, 252, 0.4), transparent);
        transition: all 0.7s ease;
        z-index: -1;
    }
    
    .neon-button:hover .hover-effect {
        left: 100%;
    }
    
    .validation-checkbox {
        display: flex;
        align-items: center;
        margin-bottom: 1rem;
    }
    
    .validation-checkbox input {
        display: none;
    }
    
    .validation-checkbox label {
        display: flex;
        align-items: center;
        cursor: pointer;
        position: relative;
    }
    
    .check-animation {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
        margin-right: 10px;
        position: relative;
        transition: all 0.3s ease;
    }
    
    .validation-checkbox input:checked ~ label .check-animation {
        background: var(--neon-color);
        border-color: var(--neon-color);
    }
    
    .validation-checkbox input:checked ~ label .check-animation::after {
        content: '';
        position: absolute;
        left: 5px;
        top: 1px;
        width: 6px;
        height: 12px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }
    
    .ai-feedback {
        height: 20px;
        font-size: 0.8rem;
        color: var(--neon-color);
        opacity: 0;
        transition: opacity 0.3s ease;
    }
    
    .validation-checkbox:hover ~ .ai-feedback {
        opacity: 1;
    }
    
    .social-proof {
        margin-top: 2rem;
        text-align: center;
    }
    
    .avatars-stack {
        display: flex;
        justify-content: center;
        margin-bottom: 0.5rem;
    }
    
    .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--primary-color);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        font-weight: bold;
        margin-left: -10px;
        border: 2px solid var(--dark-bg);
        background-size: cover;
        background-position: center;
    }
    
    .avatar:first-child {
        margin-left: 0;
    }
    
    @media (max-width: 768px) {
        .newsletter-container {
            grid-template-columns: 1fr;
            padding: 2rem;
        }
        
        .newsletter-3d-icon {
            display: none;
        }
        
        .newsletter-title {
            font-size: 2rem;
        }
    }
</style>

<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
    // Initialisation des particules
    document.addEventListener('DOMContentLoaded', function() {
        if (document.getElementById('particles-js')) {
            particlesJS('particles-js', {
                "particles": {
                    "number": {
                        "value": 80,
                        "density": {
                            "enable": true,
                            "value_area": 800
                        }
                    },
                    "color": {
                        "value": "#0ff0fc"
                    },
                    "shape": {
                        "type": "circle",
                        "stroke": {
                            "width": 0,
                            "color": "#000000"
                        }
                    },
                    "opacity": {
                        "value": 0.5,
                        "random": true,
                        "anim": {
                            "enable": true,
                            "speed": 1,
                            "opacity_min": 0.1,
                            "sync": false
                        }
                    },
                    "size": {
                        "value": 3,
                        "random": true,
                        "anim": {
                            "enable": true,
                            "speed": 2,
                            "size_min": 0.1,
                            "sync": false
                        }
                    },
                    "line_linked": {
                        "enable": true,
                        "distance": 150,
                        "color": "#0ff0fc",
                        "opacity": 0.2,
                        "width": 1
                    },
                    "move": {
                        "enable": true,
                        "speed": 1,
                        "direction": "none",
                        "random": true,
                        "straight": false,
                        "out_mode": "out",
                        "bounce": false,
                        "attract": {
                            "enable": true,
                            "rotateX": 600,
                            "rotateY": 1200
                        }
                    }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": {
                        "onhover": {
                            "enable": true,
                            "mode": "grab"
                        },
                        "onclick": {
                            "enable": true,
                            "mode": "push"
                        },
                        "resize": true
                    },
                    "modes": {
                        "grab": {
                            "distance": 140,
                            "line_linked": {
                                "opacity": 1
                            }
                        },
                        "push": {
                            "particles_nb": 4
                        }
                    }
                },
                "retina_detect": true
            });
        }

        // Animation de texte dynamique
        const phrases = [
            "Des offres exclusives",
            "Un contenu premium",
            "Des avantages VIP",
            "Du contenu avant-gardiste"
        ];
        let currentPhrase = 0;
        const typingElement = document.querySelector('.typing-animation');
        
        function typeNextPhrase() {
            typingElement.textContent = phrases[currentPhrase];
            currentPhrase = (currentPhrase + 1) % phrases.length;
        }
        
        typeNextPhrase();
        setInterval(typeNextPhrase, 3000);
        
        // Feedback AI dynamique
        const aiMessages = [
            "Vos données sont sécurisées",
            "Nous détestons le spam autant que vous",
            "Protection des données RGPD",
            "Seulement du contenu pertinent"
        ];
        const aiFeedback = document.querySelector('.ai-feedback');
        
        document.querySelector('#consent-ai').addEventListener('mouseover', function() {
            const randomMessage = aiMessages[Math.floor(Math.random() * aiMessages.length)];
            aiFeedback.textContent = randomMessage;
        });
    });
</script>
