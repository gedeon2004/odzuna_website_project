<section class="newsletter-section">
    <div class="newsletter-container">
        <div class="newsletter-text">
            <h3>Restez informés</h3>
            <p>Abonnez-vous à notre newsletter pour recevoir nos dernières offres et actualités</p>
        </div>
        <form class="newsletter-form">
            <div class="form-group">
                <input type="email" placeholder="Votre adresse email" required>
                <button type="submit" class="btn-newsletter">
                    <span>S'abonner</span>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <div class="form-check">
                <input type="checkbox" id="newsletter-consent" required>
                <label for="newsletter-consent">J'accepte de recevoir des communications par email</label>
            </div>
        </form>
    </div>
</section>
