{% load static %}
<footer class="nextgen-footer">
    <!-- Effet de vague animée -->
    <div class="footer-wave"></div>
    
    <div class="footer-container">
        <!-- Logo holographique -->
        <div class="holographic-logo">
            <div class="logo-grid">
                <div class="logo-particle" style="--delay: 0"></div>
                <div class="logo-particle" style="--delay: 0.1"></div>
                <div class="logo-particle" style="--delay: 0.2"></div>
                <div class="logo-particle" style="--delay: 0.3"></div>
                <div class="logo-particle" style="--delay: 0.4"></div>
                <div class="logo-particle" style="--delay: 0.5"></div>
                <div class="logo-particle" style="--delay: 0.6"></div>
                <div class="logo-particle" style="--delay: 0.7"></div>
                <div class="logo-particle" style="--delay: 0.8"></div>
            </div>
            <h3 class="logo-text">Odzuna</h3>
        </div>

        <!-- Réseaux sociaux avec animations -->
        <div class="social-links">
            <a href="#" class="social-icon" data-tooltip="Facebook">
                <i class="fab fa-facebook-f"></i>
                <span class="social-pulse"></span>
            </a>
            <a href="#" class="social-icon" data-tooltip="Instagram">
                <i class="fab fa-instagram"></i>
                <span class="social-pulse"></span>
            </a>
            <a href="#" class="social-icon" data-tooltip="WhatsApp">
                <i class="fab fa-whatsapp"></i>
                <span class="social-pulse"></span>
            </a>
            <a href="#" class="social-icon" data-tooltip="LinkedIn">
                <i class="fab fa-linkedin-in"></i>
                <span class="social-pulse"></span>
            </a>
            <a href="#" class="social-icon" data-tooltip="Twitter">
                <i class="fab fa-twitter"></i>
                <span class="social-pulse"></span>
            </a>
        </div>

        <!-- Navigation avec effet de surbrillance -->
        <nav class="footer-nav">
            <ul>
                <li><a href="#" data-text="Accueil">Accueil</a></li>
                <li><a href="{% url 'about' %}" data-text="À propos">À propos</a></li>
                <li><a href="{% url 'services:automobiles'%}" data-text="Services">Services</a></li>
                <li><a href="{% url 'travel:usa' %}" data-text="Voyages">Voyages</a></li>
                <li><a href="{% url 'contact'%}" data-text="Contact">Contact</a></li>
                {% comment %} <li><a href="#" data-text="Blog">Blog</a></li> {% endcomment %}
            </ul>
        </nav>

        <!-- Légales avec effet de scan -->
        <div class="legal-links">
            <a href="#" class="legal-link">
                <span class="legal-scan"></span>
                Mentions légales
            </a>
            <span class="separator">|</span>
            <a href="#" class="legal-link">
                <span class="legal-scan"></span>
                Politique de confidentialité
            </a>
            <span class="separator">|</span>
            <a href="#" class="legal-link">
                <span class="legal-scan"></span>
                Conditions d'utilisation
            </a>
        </div>

        <!-- Copyright avec effet de dégradé animé -->
        <div class="copyright">
            <p>
                <span class="copyright-text">&copy; 2025 Odzuna. Tous droits réservés.</span>
                <span class="copyright-glitch">© 2025 Odzuna. All rights reversed.</span>
            </p>
        </div>

        <!-- Bouton retour en haut futuriste -->
        <button class="back-to-top">
            <i class="fas fa-arrow-up"></i>
            <span class="top-pulse"></span>
        </button>
    </div>
</footer>

<style>
    :root {
        --primary-accent: #6e45e2;
        --secondary-accent: #88d3ce;
        --neon-effect: #0ff0fc;
        --dark-bg: #0f0f1a;
        --particle-color: rgba(15, 240, 252, 0.7);
    }
    
    .nextgen-footer {
        position: relative;
        background: linear-gradient(to bottom, #000000, var(--dark-bg));
        color: white;
        padding: 4rem 1rem 2rem;
        overflow: hidden;
        font-family: 'Segoe UI', system-ui, sans-serif;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .footer-wave {
        position: absolute;
        top: -50px;
        left: 0;
        width: 100%;
        height: 50px;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 1200 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,52.47V0Z' fill='%230ff0fc' opacity='.1'/%3E%3Cpath d='M0,0V15.81C13,36.92,27.64,56.86,47.69,72.05,99.41,111.27,165,111,224.58,91.58c31.15-10.15,60.09-26.07,89.67-39.8,40.92-19,84.73-46,130.83-49.67,36.26-2.85,70.9,9.42,98.6,31.56,31.77,25.39,62.32,62,103.63,73,40.44,10.79,81.35-6.69,119.13-24.28s75.16-39,116.92-43.05c59.73-5.85,113.28,22.88,168.9,38.84,30.2,8.66,59,6.17,87.09-7.5,22.43-10.89,48-26.93,60.65-49.24V0Z' fill='%230ff0fc' opacity='.2'/%3E%3Cpath d='M0,0V5.63C149.93,59,314.09,71.32,475.83,42.57c43-7.64,84.23-20.12,127.61-26.46,59-8.63,112.48,12.24,165.56,35.4C827.93,77.22,886,95.24,951.2,90c86.53-7,172.46-45.71,248.8-84.81V0Z' fill='%230ff0fc' opacity='.3'/%3E%3C/svg%3E");
        background-size: cover;
        animation: wave-animation 10s linear infinite;
    }
    
    @keyframes wave-animation {
        0% { background-position-x: 0; }
        100% { background-position-x: 1200px; }
    }
    
    .footer-container {
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        z-index: 2;
    }
    
    .holographic-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 2rem;
    }
    
    .logo-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 5px;
        margin-bottom: 1rem;
    }
    
    .logo-particle {
        width: 30px;
        height: 30px;
        background-color: var(--particle-color);
        border-radius: 50%;
        opacity: 0;
        animation: particle-flicker 2s infinite;
        animation-delay: calc(var(--delay) * 1s);
        box-shadow: 0 0 10px var(--neon-effect);
    }
    
    @keyframes particle-flicker {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.1); }
    }
    
    .logo-text {
        font-size: 2rem;
        font-weight: 700;
        background: linear-gradient(90deg, var(--neon-effect), var(--secondary-accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin: 0;
    }
    
    .social-links {
        display: flex;
        justify-content: center;
        gap: 1.5rem;
        margin-bottom: 2rem;
    }
    
    .social-icon {
        position: relative;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        font-size: 1rem;
        transition: all 0.3s ease;
    }
    
    .social-icon:hover {
        color: var(--neon-effect);
        transform: translateY(-5px);
        background: rgba(15, 240, 252, 0.2);
    }
    
    .social-icon::before {
        content: attr(data-tooltip);
        position: absolute;
        bottom: -30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 0.3rem 0.6rem;
        border-radius: 4px;
        font-size: 0.7rem;
        opacity: 0;
        transition: opacity 0.3s ease;
        white-space: nowrap;
    }
    
    .social-icon:hover::before {
        opacity: 1;
    }
    
    .social-pulse {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 1px solid var(--neon-effect);
        opacity: 0;
        animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
        0% { transform: scale(0.8); opacity: 0.7; }
        70% { transform: scale(1.3); opacity: 0; }
        100% { opacity: 0; }
    }
    
    .footer-nav ul {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 1.5rem;
        padding: 0;
        list-style: none;
        margin-bottom: 2rem;
    }
    
    .footer-nav a {
        position: relative;
        color: #ccc;
        text-decoration: none;
        font-weight: 500;
        padding: 0.5rem 0;
        overflow: hidden;
    }
    
    .footer-nav a::before {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        color: var(--neon-effect);
        white-space: nowrap;
        overflow: hidden;
        transition: width 0.3s ease;
    }
    
    .footer-nav a:hover::before {
        width: 100%;
    }
    
    .legal-links {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 2rem;
    }
    
    .legal-link {
        position: relative;
        color: #999;
        text-decoration: none;
        font-size: 0.9rem;
        padding: 0.5rem 0;
    }
    
    .legal-scan {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 0;
        height: 1px;
        background: var(--neon-effect);
        transition: width 0.3s ease;
    }
    
    .legal-link:hover .legal-scan {
        width: 100%;
    }
    
    .legal-link:hover {
        color: white;
    }
    
    .separator {
        color: rgba(255, 255, 255, 0.2);
    }
    
    .copyright {
        margin-bottom: 2rem;
        position: relative;
    }
    
    .copyright-text {
        position: relative;
    }
    
    .copyright-glitch {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, var(--dark-bg), var(--primary-accent), var(--dark-bg));
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: glitch-effect 5s infinite linear;
        opacity: 0;
    }
    
    .copyright:hover .copyright-glitch {
        opacity: 1;
    }
    
    @keyframes glitch-effect {
        0% { background-position: 0 0; }
        100% { background-position: -200% 0; }
    }
    
    .back-to-top {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 50px;
        height: 50px;
        background: rgba(15, 240, 252, 0.2);
        border: 1px solid var(--neon-effect);
        border-radius: 50%;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0;
        transform: translateY(20px);
        transition: all 0.3s ease;
        z-index: 100;
    }
    
    .back-to-top.visible {
        opacity: 1;
        transform: translateY(0);
    }
    
    .back-to-top:hover {
        background: rgba(15, 240, 252, 0.4);
        box-shadow: 0 0 15px var(--neon-effect);
    }
    
    .top-pulse {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 1px solid var(--neon-effect);
        opacity: 0;
        animation: top-pulse-anim 2s infinite;
    }
    
    @keyframes top-pulse-anim {
        0% { transform: scale(0.8); opacity: 0.7; }
        70% { transform: scale(1.3); opacity: 0; }
        100% { opacity: 0; }
    }
    
    @media (max-width: 768px) {
        .footer-nav ul {
            gap: 1rem;
        }
        
        .legal-links {
            gap: 0.5rem;
        }
        
        .back-to-top {
            width: 40px;
            height: 40px;
            bottom: 20px;
            right: 20px;
        }
    }
</style>

<script>
    // Animation du bouton retour en haut
    document.addEventListener('DOMContentLoaded', function() {
        const backToTop = document.querySelector('.back-to-top');
        
        window.addEventListener('scroll', function() {
            if (window.pageYOffset > 300) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });
        
        backToTop.addEventListener('click', function(e) {
            e.preventDefault();
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
        
        // Effet de survol holographique pour le logo
        const logoParticles = document.querySelectorAll('.logo-particle');
        
        document.querySelector('.holographic-logo').addEventListener('mouseover', function() {
            logoParticles.forEach(particle => {
                particle.style.animation = 'particle-flicker 0.5s infinite';
            });
        });
        
        document.querySelector('.holographic-logo').addEventListener('mouseout', function() {
            logoParticles.forEach(particle => {
                particle.style.animation = 'particle-flicker 2s infinite';
            });
        });
    });
</script>
